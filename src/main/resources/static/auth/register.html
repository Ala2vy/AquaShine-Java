<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AquaShine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="container-narrow">
        <div class="card mt-4">
            <h2 class="mb-3">Create your account</h2>
            <p class="text-muted mb-4">Join AquaShine and book your first wash.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="10-13 digits" required>
                    <div class="hint">10 to 13 digits, no spaces</div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="8-20 characters" required autocomplete="new-password">
                    <div class="hint">Between 8 and 20 characters</div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    Create Account
                </button>
                <p id="error" class="error-message"></p>
            </form>

            <p class="text-center mt-3 text-muted">
                Already have an account? <a href="/auth/login.html" style="color:var(--primary);">Login</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AquaShine - STQA Lab Project</p>
    </footer>

    <script src="/js/toast.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
