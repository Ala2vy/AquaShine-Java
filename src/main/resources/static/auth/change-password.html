<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - AquaShine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="app-layout">
        <aside id="sidebar"></aside>

        <main class="app-main">
            <div class="dashboard-header" style="margin-bottom:1.75rem;">
                <h1 style="font-size:1.85rem;">Change Password</h1>
                <p class="text-muted" style="margin-top:.25rem;">Pick a strong password between 8 and 20 characters.</p>
            </div>

            <div class="card" style="max-width:520px;">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="oldPassword">Current Password</label>
                        <input type="password" id="oldPassword" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" required autocomplete="new-password">
                        <div class="hint">Between 8 and 20 characters</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Change Password</button>
                    <p id="error" class="error-message"></p>
                </form>
            </div>
        </main>
    </div>

    <footer><p>&copy; 2026 AquaShine - STQA Lab Project</p></footer>

    <script src="/js/toast.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
