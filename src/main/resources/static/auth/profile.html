<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - AquaShine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="app-layout">
        <aside id="sidebar"></aside>

        <main class="app-main">
            <div class="dashboard-header" style="margin-bottom:1.75rem;">
                <h1 style="font-size:1.85rem;">My Profile</h1>
                <p class="text-muted" style="margin-top:.25rem;">Manage your account details.</p>
            </div>

            <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;max-width:640px;">
                <!-- Profile Info Card -->
                <div class="card">
                    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--gray-100);">
                        <div id="avatar" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--blue-600),var(--aqua-500));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;">?</div>
                        <div>
                            <div style="font-weight:600;font-size:1.05rem;" id="emailHeader">Loading…</div>
                            <div class="text-muted" style="font-size:.85rem;">Member of AquaShine</div>
                        </div>
                    </div>

                    <h3 style="font-size:1.05rem;margin-bottom:1rem;">Edit Profile</h3>
                    <form id="editForm">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" required>
                            <div class="hint">10 to 13 digits</div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                        <p id="editError" class="error-message"></p>
                    </form>
                </div>

                <!-- Change Password Link Card -->
                <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:1.5rem;">
                    <div>
                        <h3 style="font-size:1rem;margin-bottom:.25rem;">🔒 Change Password</h3>
                        <p class="text-muted" style="font-size:.85rem;">Update your account security.</p>
                    </div>
                    <a href="/auth/change-password.html" class="btn btn-ghost">Change →</a>
                </div>
            </div>
        </main>
    </div>

    <footer><p>&copy; 2026 AquaShine - STQA Lab Project</p></footer>

    <script src="/js/toast.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
